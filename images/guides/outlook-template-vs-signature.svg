<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration: keep the reusable body in the template and let Outlook add your signature from signature settings" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1600" height="1000" fill="#f7f5ef"/><rect x="60" y="60" width="1480" height="880" rx="24" fill="#fff" stroke="#d9dee5" stroke-width="2"/><path d="M60 84a24 24 0 0 1 24-24h1432a24 24 0 0 1 24 24v44H60z" fill="#f7f5ef"/><circle cx="100" cy="94" r="9" fill="#ff6058"/><circle cx="128" cy="94" r="9" fill="#ffbd2e"/><circle cx="156" cy="94" r="9" fill="#28c840"/><text x="800" y="103" font-size="22" font-weight="500" fill="#4a5d72" text-anchor="middle">New message from template</text><line x1="60" y1="128" x2="1540" y2="128" stroke="#d9dee5" stroke-width="2"/><text x="120" y="200" font-size="24" font-weight="500" fill="#4a5d72" text-anchor="start">Subject</text><rect x="240" y="168" width="700" height="48" rx="8" fill="#fff" stroke="#d9dee5" stroke-width="2"/><text x="256" y="200" font-size="22" font-weight="400" fill="#061b31" text-anchor="start">Your quote from Acme</text><rect x="110" y="250" width="860" height="330" rx="14" fill="#e8f0ff" stroke="#0b5cff" stroke-width="3"/><text x="140" y="310" font-size="24" font-weight="400" fill="#061b31" text-anchor="start">Hi [FIRST NAME],</text><text x="140" y="356" font-size="24" font-weight="400" fill="#061b31" text-anchor="start">Thanks for your time today. As promised, here is</text><text x="140" y="402" font-size="24" font-weight="400" fill="#061b31" text-anchor="start">the quote we discussed. It is valid until [DATE].</text><text x="140" y="448" font-size="24" font-weight="400" fill="#061b31" text-anchor="start">Let me know if you have any questions.</text><text x="140" y="548" font-size="20" font-weight="600" fill="#0b5cff" text-anchor="start">Saved in the template</text><rect x="110" y="610" width="860" height="280" rx="14" fill="#fff" stroke="#1aa89f" stroke-width="3"/><circle cx="200" cy="720" r="52" fill="#ddf7f5"/><text x="200" y="732" font-size="30" font-weight="600" fill="#1aa89f" text-anchor="middle">AC</text><text x="280" y="700" font-size="28" font-weight="600" fill="#061b31" text-anchor="start">Alex Carter</text><text x="280" y="740" font-size="22" font-weight="400" fill="#4a5d72" text-anchor="start">Account Manager · Acme Co.</text><text x="280" y="776" font-size="22" font-weight="400" fill="#0b5cff" text-anchor="start">+1 415 555 0100 · acme.example</text><text x="140" y="862" font-size="20" font-weight="600" fill="#1aa89f" text-anchor="start">Added by Outlook from your signature settings</text><rect x="1030" y="250" width="470" height="330" rx="16" fill="#fff" stroke="#d9dee5" stroke-width="2"/><text x="1060" y="310" font-size="28" font-weight="600" fill="#0b5cff" text-anchor="start">Template</text><text x="1060" y="360" font-size="23" font-weight="400" fill="#4a5d72" text-anchor="start">The body you reuse:</text><text x="1060" y="400" font-size="23" font-weight="400" fill="#4a5d72" text-anchor="start">greeting, text, subject,</text><text x="1060" y="440" font-size="23" font-weight="400" fill="#4a5d72" text-anchor="start">attachments, placeholders.</text><rect x="1030" y="610" width="470" height="280" rx="16" fill="#fff" stroke="#d9dee5" stroke-width="2"/><text x="1060" y="670" font-size="28" font-weight="600" fill="#1aa89f" text-anchor="start">Signature</text><text x="1060" y="720" font-size="23" font-weight="400" fill="#4a5d72" text-anchor="start">Set up once in Outlook.</text><text x="1060" y="760" font-size="23" font-weight="400" fill="#4a5d72" text-anchor="start">Update it in one place and</text><text x="1060" y="800" font-size="23" font-weight="400" fill="#4a5d72" text-anchor="start">every email stays current.</text><text x="1520" y="975" font-size="18" font-weight="400" fill="#8796a8" text-anchor="end">Illustration · signtry.com</text></svg>
